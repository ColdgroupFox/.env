<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷狐 - 联系信息</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", Arial, sans-serif;
        }
        
        body {
            line-height: 1.6;
            color: #333;
        }
        
        .contact-card {
            max-width: 600px;
            margin: 20px auto;
            padding: 30px;
            display: flex;
            align-items: center;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }
        
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            overflow: hidden;
            margin-right: 30px;
        }
        
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .info {
            flex: 1;
        }
        
        .name {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .position {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }
        
        .contact-list {
            list-style: none;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            font-size: 16px;
        }
        
        .icon {
            color: #999;
            margin-right: 15px;
            font-size: 20px;
        }
        
        .email, .phone {
            color: #1a8cff;
        }
        
        .address {
            color: #666;
        }
        
        .slogan {
            margin-top: 40px;
            font-size: 14px;
            color: #999;
            text-align: center;
        }
    </style>
    <!-- 引入Font Awesome图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="contact-card">
        <div class="avatar">
            <!-- 替换为你的头像图片路径 -->
            <img src="/public/images/head1.jpg" alt="冷狐头像">
        </div>
        <div class="info">
            <h1 class="name">冷狐</h1>
            <p class="position">总经理 Fox·Team</p>
            <ul class="contact-list">
                <li class="contact-item">
                    <i class="fas fa-envelope icon"></i>
                    <span class="email">coldgroupfox@163.com</span>
                </li>
                <li class="contact-item">
                    <i class="fas fa-phone icon"></i>
                    <span class="phone">648890007</span>
                </li>
                <li class="contact-item">
                    <i class="fas fa-map-marker-alt icon"></i>
                    <span class="address">上海市·徐汇区</span>
                </li>
            </ul>
            <p class="slogan">乘风破浪浮云远, 御涛凌云题金名</p>
        </div>
    </div>
</body>
</html>
